name: Standards CI

on:
  pull_request:
    paths:
      - ".github/actions/scope-check/**"
      - ".github/actions/verify-deploy/**"
      - ".github/actions/verification-factory/**"
      - ".github/workflows/ci-react-ts.yml"
      - ".github/workflows/ci-react-ts-self-hosted.yml"
      - ".github/workflows/standards-ci.yml"
      - "starter/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "VERIFIED_CLOSURE_CONTRACT.md"

permissions:
  contents: read

jobs:
  scope-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out standards branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run deterministic scope and closure fixtures
        run: node --test tests/scope-check.test.mjs tests/verify-deploy.test.mjs tests/workflow-reference.test.mjs tests/starter.test.mjs tests/verification-factory.test.mjs tests/handoff-generator.test.mjs tests/dry-run-consumer.test.mjs
