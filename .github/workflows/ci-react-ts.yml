name: React TypeScript CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate verification posture
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = pkg.scripts || {};
          const files = execSync('git ls-files', { encoding: 'utf8' })
            .split('\n')
            .filter(Boolean);
          const testFiles = files.filter((file) =>
            /(^|\/).+\.(test|spec)\.[cm]?[jt]sx?$/.test(file)
          );

          if (!scripts.build) {
            throw new Error('package.json must define a build script');
          }

          if (
            fs.existsSync('tsconfig.json') &&
            !scripts.typecheck &&
            !/\btsc\b/.test(scripts.build)
          ) {
            throw new Error(
              'TypeScript repository has neither a typecheck script nor a build script that invokes tsc'
            );
          }

          if (testFiles.length > 0 && !scripts.test) {
            throw new Error(`Found ${testFiles.length} test file(s) but no test script`);
          }

          if (
            scripts.test &&
            /(^|&&|;)\s*(echo\b.*no tests?|exit\s+0\b|true\s*$)/i.test(scripts.test)
          ) {
            throw new Error('Test script appears to be a no-op');
          }

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            testFiles.length > 0
              ? `Detected ${testFiles.length} test file(s).\n`
              : 'No automated test files are currently tracked; CI does not claim test coverage.\n'
          );
          NODE

      - name: Typecheck when configured
        run: npm run typecheck --if-present

      - name: Lint when configured
        run: npm run lint --if-present

      - name: Run tests when configured
        run: npm test --if-present

      - name: Build
        run: npm run build

      - name: Confirm verification did not rewrite tracked files
        run: git diff --exit-code

      - name: Report built bundle size
        if: always()
        shell: bash
        run: |
          if [ -d dist ]; then
            size_kb=$(du -sk dist | cut -f1)
            echo "Built dist size: ${size_kb} KB" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dist directory produced." >> "$GITHUB_STEP_SUMMARY"
          fi
